name: Build

on:
  # Only changes that end up in the installer build (and release) the app. Docs and site/ changes don't.
  push:
    branches: [main]
    paths: &app-paths
      - src/**
      - installer/**
      - scripts/**
      - assets/**
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/build.yml
  pull_request:
    paths: *app-paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build on main is released as v<VERSION_PREFIX>.<run number>. Bump this for a new minor/major.
  VERSION_PREFIX: "0.1"
  # UxPlay master with the built-in mDNS responder (new in 1.74, not in a tagged release yet).
  UXPLAY_COMMIT: 0477d471cc5899ea13382b5871cf70dbfe050ebd

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore receiver bundle
        id: receiver-cache
        uses: actions/cache@v6
        with:
          path: dist/receiver
          key: receiver-${{ env.UXPLAY_COMMIT }}-${{ hashFiles('scripts/bundle-receiver.sh') }}

      - name: Set up MSYS2
        if: steps.receiver-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            cmake:p ninja:p gcc:p openssl:p libplist:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p gst-libav:p

      - name: Build receiver bundle
        if: steps.receiver-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/bundle-receiver.sh "$UXPLAY_COMMIT" dist/receiver

      - name: Smoke-test receiver bundle
        shell: pwsh
        run: ./scripts/smoke-test-receiver.ps1 dist/receiver

      - name: Pick version
        id: version
        shell: bash
        run: echo "version=$VERSION_PREFIX.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build tray app
        run: dotnet build src/BetterAirPlay -c Release -p:Version=${{ steps.version.outputs.version }} -o dist/app

      - name: Stage app
        shell: pwsh
        run: |
          Remove-Item dist/app/*.pdb
          Copy-Item dist/receiver dist/app/receiver -Recurse
          Copy-Item THIRD-PARTY-NOTICES.md dist/app/

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DAppDir=$PWD\dist\app" `
            "/DOutDir=$PWD\dist\installer" `
            installer\BetterAirPlay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\installer | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - uses: actions/upload-artifact@v7
        with:
          name: BetterAirPlay-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BetterAirPlay-Setup
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on the built commit. Tags pushed with GITHUB_TOKEN don't trigger workflows, so this can't loop.
        # The website links to releases/latest/download/BetterAirPlay-Setup.exe, so a copy without the version is attached too.
        run: |
          cp dist/BetterAirPlay-Setup-*.exe dist/BetterAirPlay-Setup.exe
          gh release create "v$VERSION_PREFIX.$GITHUB_RUN_NUMBER" dist/*.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --latest
